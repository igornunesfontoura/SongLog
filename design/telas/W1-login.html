<!doctype html>
<html lang="pt-BR" data-theme="claro">
<head><meta charset="utf-8"><title>W1 · Login</title><link rel="stylesheet" href="../style.css"></head>
<body>
<div class="win sem-barra" style="display:grid;grid-template-columns:720px 1fr">
  <section style="background:var(--ink);color:var(--bg);padding:64px;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font:600 28px/1 'Source Serif 4';letter-spacing:.08em">SONGLOG</div>
    <div>
      <h1 style="font-size:64px;line-height:68px">O disco é a<br>soma das faixas.</h1>
      <p style="margin-top:28px;color:var(--surface);font-size:16px;line-height:24px">Avalie faixa por faixa.<br>Registre o que ouviu.</p>
    </div>
    <div class="mono small" style="color:var(--surface)">v0.1.0</div>
  </section>
  <section style="display:flex;flex-direction:column;justify-content:center;padding:0 96px">
    <h2 style="font-size:32px;line-height:40px;margin-bottom:8px">Entrar</h2>
    <div style="border-top:2px solid var(--ink);width:360px;margin-bottom:28px"></div>
    <div class="campo" style="width:360px"><label class="lbl">E-mail</label><div class="inp">ana@songlog.dev</div></div>
    <div class="campo" style="width:360px"><label class="lbl">Senha</label>
      <div class="inp foco"><span class="mono" style="letter-spacing:2px">••••••••••</span><span class="r">Mostrar senha</span></div></div>
    <div style="width:360px;margin-top:8px"><a class="btn p" style="width:100%;height:40px">Entrar</a></div>
    <p style="margin-top:20px;width:360px" class="small">Não tem conta? <u style="text-underline-offset:3px">Criar conta</u></p>
  </section>
</div></body>
</html>
