# Conexão com o MySQL (valores padrão do SongLog).
#
# Você não precisa editar este arquivo: se a conexão falhar, o programa abre uma janela pedindo usuário
# e senha e guarda o resultado em config/songlog.local.properties (que não vai para o Git).
# Só edite aqui se o seu MySQL não roda em localhost:3306 ou se quiser trocar o nome do banco.
#
# Também é possível usar variáveis de ambiente (SONGLOG_DB_HOST, SONGLOG_DB_PORTA, SONGLOG_DB_NOME,
# SONGLOG_DB_USUARIO, SONGLOG_DB_SENHA) ou -Dsonglog.db.host=... na linha de comando.
banco.host=localhost
banco.porta=3306
banco.nome=songlog
banco.usuario=root
banco.senha=

# true: na primeira execução, com o banco vazio, carrega os dados de teste (banco/02-dados-iniciais.sql)
banco.dados-iniciais=true
